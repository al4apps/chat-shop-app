schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  ChatShop — Kotlin Multiplatform клиент chat-commerce: только Android и iOS
  (Compose Multiplatform), Web/JS/Wasm исключены.

  Продукт — клиентский мессенджер chat-shop: пользователь авторизуется и ведёт
  диалог о покупке; платежей в приложении нет, покупка и статусы идут в чате.

  Язык интерфейса, документации и спек — русский. Структурные заголовки OpenSpec
  и ключевые слова SHALL/WHEN/THEN сохранять на английском.

  БД — единственный источник истины для UI: данные сервера сначала сохраняются
  в SQLDelight, UI читает только Flow из БД.

  Деньги — decimal-строка и Money, без Double/Float. Время — Instant/epoch millis.
  Роль клиента на сервере — CLIENT; из команд заказа доступна только ORDER_COMPLETED
  из PROCESSING. У каждого исходящего сообщения/файла есть clientMessageId.

  Архитектура, публичные API, структура проекта и библиотеки меняются только
  по согласованию. Новые изменения поведения оформляются через openspec/changes.

